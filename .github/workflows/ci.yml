# Runs the same checks as pre-commit, on a clean machine, for every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes exact tags only (no moving "v10" tag).
      - uses: astral-sh/setup-uv@v10.4.0
      # --locked: fail if uv.lock does not match pyproject.toml.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm ci: install exactly what package-lock.json says, or fail.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t calendar-planner .
      # Start the image and ask the health endpoint. The key is a dummy:
      # /api/health never calls Gemini.
      - run: docker run -d --name app -p 8080:8080 -e GOOGLE_API_KEY=dummy calendar-planner
      - run: |
          for i in $(seq 1 30); do
            curl -fs localhost:8080/api/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1
      - run: curl -fs localhost:8080/ | grep "<title>Calendar planner</title>"

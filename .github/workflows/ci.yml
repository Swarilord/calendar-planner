# Runs the same checks as pre-commit, on a clean machine, for every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes exact tags only (no moving "v10" tag).
      - uses: astral-sh/setup-uv@v10.4.0
      # --locked: fail if uv.lock does not match pyproject.toml.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm ci: install exactly what package-lock.json says, or fail.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

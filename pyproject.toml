[project]
name = "calendar-planner"
version = "0.1.0"
description = "LLM agent that plans study time into Google Calendar using a CP-SAT solver."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-adk>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives in ./planner, not ./src/planner.
module-name = "planner"
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
target-version = "py313"
# The brief is a source document, not code to reformat.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors: basic style problems
    "W",   # pycodestyle warnings: whitespace
    "F",   # pyflakes: unused imports, undefined names
    "I",   # isort: import order
    "UP",  # pyupgrade: use modern Python syntax
    "B",   # flake8-bugbear: common bug patterns
]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[project]
name = "calendar-planner"
version = "0.1.0"
description = "LLM agent that plans study time into Google Calendar using a CP-SAT solver."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dspy==3.5.0",
    "fastapi>=0.165.0",
    "google-adk>=2.15.0",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "ortools>=9.15.6755",
    "pydantic>=2.14.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives in ./planner, not ./src/planner.
module-name = "planner"
module-root = ""

[dependency-groups]
dev = [
    "google-api-python-client-stubs>=1.40.0",
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
target-version = "py313"
# The brief is a source document, not code to reformat.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors: basic style problems
    "W",   # pycodestyle warnings: whitespace
    "F",   # pyflakes: unused imports, undefined names
    "I",   # isort: import order
    "UP",  # pyupgrade: use modern Python syntax
    "B",   # flake8-bugbear: common bug patterns
]

[tool.mypy]
strict = true
python_version = "3.13"
# Checked by a plain `mypy` run (terminal, pre-commit, CI).
files = ["planner", "experiments", "tests"]
# Teaches mypy Pydantic rules, e.g. that frozen models cannot be assigned to.
plugins = ["pydantic.mypy"]

# DSPy and google-auth-oauthlib ship no type information: accept their
# imports as untyped (Any).
[[tool.mypy.overrides]]
module = ["dspy", "dspy.*", "google_auth_oauthlib", "google_auth_oauthlib.*"]
ignore_missing_imports = true

# DSPy signatures must subclass dspy.Signature, which mypy only sees as Any.
[[tool.mypy.overrides]]
module = ["planner.parser.parse", "planner.evals.baselines"]
disallow_subclassing_any = false

[tool.pytest]
testpaths = ["tests"]
addopts = ["--strict-markers"]

# google-auth's Credentials methods (refresh, has_scopes, to_json, ...) have no
# type hints; allow calling them only in the module that wraps them.
[[tool.mypy.overrides]]
module = ["planner.calendar.auth", "tests.test_auth", "tests.test_google_calendar"]
disallow_untyped_calls = false
